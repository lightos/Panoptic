repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        exclude: ^(panoptic\.py|\.claire/)
        # Keep these in sync with the lower bounds in pyproject.toml so the
        # hook type-checks against the same library versions as CI.
        additional_dependencies:
          - aiohttp==3.14.4
          - aiohttp-socks==0.12.0
          - multidict==6.9.1
          - yarl==1.25.1
          - rich==15.0.0
          - rich-argparse==1.8.0
          - pytest==9.1.1
          - pytest-asyncio==1.4.0
          - pytest-aiohttp==1.1.1
        args: [--strict]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        args: [--fix]
        exclude: ^(docs/superpowers/|\.claire/)

  - repo: https://github.com/pypa/pip-audit
    rev: v2.10.1
    hooks:
      - id: pip-audit
        # Audit the project's declared dependencies rather than pip-audit's
        # ambient hook environment.
        args: [--desc=on, .]
        pass_filenames: false
