[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "panoptic"
version = "2.0.0"
description = "Search and retrieve content of common log and config files via path traversal vulnerability"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Roberto Christopher Salgado Bjerre"},
    {name = "Miroslav Stampar"},
]
dependencies = [
    "httpx[socks]>=0.28.1",
    "rich>=15.0.0",
    "rich-argparse>=1.8.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/lightos/Panoptic"
Issues = "https://github.com/lightos/Panoptic/issues"
Source = "https://github.com/lightos/Panoptic"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-httpx>=0.36.2",
    "ruff>=0.16.1",
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pip-audit>=2.10.1",
    "build>=1.5.0",
    "twine>=7.0.0",
]

[tool.setuptools.packages.find]
include = ["panoptic*"]

[tool.setuptools.package-data]
panoptic = ["data/*"]

[project.scripts]
panoptic = "panoptic.__main__:main"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
exclude = ["^panoptic\\.py$", "^\\.claire/"]

[[tool.mypy.overrides]]
module = ["rich_argparse", "tomli"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
