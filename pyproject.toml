[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "panoptic"
version = "2.0.0"
description = "Search and retrieve content of common log and config files via path traversal vulnerability"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "Roberto Christopher Salgado Bjerre"},
    {name = "Miroslav Stampar"},
]
dependencies = [
    "aiohttp>=3.14.4",
    "aiohttp-socks>=0.12.0",
    "multidict>=6.9.1",
    "yarl>=1.25.1",
    "rich>=15.0.0",
    "rich-argparse>=1.8.0",
]

[project.urls]
Homepage = "https://github.com/lightos/Panoptic"
Issues = "https://github.com/lightos/Panoptic/issues"
Source = "https://github.com/lightos/Panoptic"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-aiohttp>=1.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pip-audit>=2.10.1",
    "build>=1.6.1",
    "twine>=7.0.0",
]

[tool.setuptools.packages.find]
include = ["panoptic*"]

[tool.setuptools.package-data]
panoptic = ["data/*"]

[project.scripts]
panoptic = "panoptic.__main__:main"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["^panoptic\\.py$", "^\\.claire/"]

[[tool.mypy.overrides]]
module = ["rich_argparse"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
