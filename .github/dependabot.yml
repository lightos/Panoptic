version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # Panoptic tracks the latest releases: raise the lower bounds in
    # pyproject.toml (and mirror them in .github/constraints-min.txt).
    versioning-strategy: increase
    commit-message:
      prefix: deps
    ignore:
      # aiohttp (latest 3.14.4) requires multidict<7; bumping the floor to 7
      # makes Panoptic uninstallable. Remove once aiohttp allows multidict 7.
      - dependency-name: multidict
        versions: [">=7"]
    groups:
      python-dependencies:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"
