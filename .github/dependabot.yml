version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # Panoptic tracks the latest releases: raise the lower bounds in
    # pyproject.toml (and mirror them in .github/constraints-min.txt).
    versioning-strategy: increase
    commit-message:
      prefix: deps
    groups:
      python-dependencies:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"
